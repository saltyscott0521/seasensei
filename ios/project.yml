name: SeaSensei
options:
  bundleIdPrefix: com.saltyscott
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SeaSensei:
    type: application
    platform: iOS
    sources: [SeaSensei]
    info:
      path: SeaSensei/Info.plist
      properties:
        CFBundleDisplayName: SeaSensei
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.saltyscott.seasensei
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [SeaSenseiTests]
  SeaSenseiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SeaSenseiTests]
    dependencies:
      - target: SeaSensei
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
