<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SeaSensei</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SeaSensei">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><button id="back" hidden aria-label="Back">‹</button><h1 id="title">SeaSensei</h1><button id="add" aria-label="Add spot">+</button></header>
<main id="view"></main>
<dialog id="addDlg">
  <form method="dialog" id="addForm">
    <h2>New spot</h2>
    <p class="hint">Tap the map to drop a pin.</p>
    <div id="map"></div>
    <label>Name <input name="name" required></label>
    <div class="row">
      <label>Min kn <input name="min" type="number" value="15" min="0" required></label>
      <label>Max kn <input name="max" type="number" value="30" min="1" required></label>
    </div>
    <label>NOAA station ID <small>(optional, e.g. 8726607)</small> <input name="station" inputmode="numeric" pattern="[0-9]{7}"></label>
    <div class="row"><button value="cancel" formnovalidate>Cancel</button><button id="save" value="ok" class="primary">Save</button></div>
  </form>
</dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
